<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clownsec Big Top</title>
<style>
:root {
  --bg: #0f0d14; --panel: #1a1622; --panel2: #231d2e; --line: #352c45;
  --ink: #eee8f6; --dim: #a397b5; --accent: #ff3d6e; --accent2: #ffc23d; --ok: #4ade80; --warn: #fbbf24;
  --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.logo { font-weight: 800; font-size: 20px; letter-spacing: .3px; }
.logo b { color: var(--accent); }
.logo i { color: var(--accent2); font-style: normal; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); }
.grow { flex: 1; }
main { max-width: 1280px; margin: 0 auto; padding: 18px 22px 60px; }
h2 { font-size: 16px; margin: 26px 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
button, .btn { font: inherit; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.small { padding: 4px 9px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
input, textarea, select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 0; }
.libs { display: grid; gap: 10px; }
.lib { display: flex; gap: 12px; align-items: center; }
.lib .name { font-weight: 700; }
.lib .folders { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.tile { cursor: pointer; }
.tile .art { aspect-ratio: 175 / 250; border-radius: 8px; background: var(--panel2) center/cover no-repeat; border: 1px solid var(--line); position: relative; overflow: hidden; }
.tile .art .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 12px; padding: 8px; text-align: center; }
.tile .t { font-size: 13px; margin-top: 6px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .s { font-size: 12px; color: var(--dim); }
.badge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: #000a; }
.badge.r { left: auto; right: 6px; }
.b3d { color: var(--accent2); } .bsup { color: var(--ok); } .bfn { color: var(--warn); }
.status { color: var(--dim); font-size: 13px; }
.bar { height: 4px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: #000b; }
.dlg { padding: 18px 20px; overflow: auto; max-height: calc(100vh - 40px); }
.dlg h3 { margin: 0 0 4px; }
.dlg .path { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.edit { display: grid; grid-template-columns: 170px 1fr; gap: 18px; margin-top: 12px; }
@media (max-width: 640px) { .edit { grid-template-columns: 1fr; } }
.edit .art { aspect-ratio: 175 / 250; border-radius: 8px; background: var(--panel2) center/cover no-repeat; border: 1px solid var(--line); }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--dim); }
[hidden] { display: none !important; }   /* an inline display:flex would beat the hidden attribute */
.picker { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.picker div { padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
.picker div:hover { background: var(--panel2); }
.picker img { width: 34px; height: 48px; object-fit: cover; border-radius: 4px; background: var(--panel2); }
.eps { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.ep { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 14px; }
.ep .n { color: var(--dim); width: 64px; flex: none; }
.ep .x { flex: 1; }
.err { color: var(--accent); font-size: 13px; margin-top: 8px; min-height: 1em; }
.empty { color: var(--dim); padding: 30px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="logo"><b>Clownsec</b> <i>Big Top</i></div>
  <span class="pill" id="srvname">…</span>
  <span class="pill" id="addr"></span>
  <div class="grow"></div>
  <span class="status" id="scanline"></span>
  <button id="scanbtn">Scan for new videos</button>
  <button id="setbtn">Settings</button>
  <button id="quitbtn" title="Stop Big Top">Quit</button>
</header>
<div id="updbar" hidden style="background:var(--panel2);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <span id="updtext"></span>
  <div id="updprog" class="bar" hidden style="width:180px;margin:0"><div></div></div>
  <div class="grow"></div>
  <a id="updnotes" href="#" style="color:var(--accent2)">What's new</a>
  <button class="primary" id="updbtn">Update now</button>
</div>
<div id="ffbar" hidden style="background:var(--panel2);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <span id="fftext"></span>
  <div id="ffprog" class="bar" hidden style="width:180px;margin:0"><div></div></div>
  <div class="grow"></div>
  <button class="primary" id="ffbtn" hidden>Download FFmpeg</button>
</div>
<main>
  <div class="bar" id="scanbar" hidden><div></div></div>

  <h2>Libraries</h2>
  <div class="libs" id="libs"></div>
  <p><button class="primary" id="addlib">+ Add a library</button></p>

  <h2>Browse</h2>
  <div class="tabs" id="tabs"></div>
  <div class="row" style="margin-bottom:12px"><input id="search" placeholder="Search this library…"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method, url, body, raw) {
  const opt = { method, headers: {} };
  if (body !== undefined) {
    if (raw) opt.body = body; else { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
  }
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.text()) || ('HTTP ' + r.status));
  return r.status === 204 ? null : r.json();
}

let state = null, curLib = null, libData = { items: [], shows: [] }, bust = Date.now();

async function loadState() {
  state = await api('GET', '/admin/api/state');
  $('#srvname').textContent = state.name;
  $('#addr').textContent = (state.addresses || []).join('  ·  ') || 'no network address';
  $('#addr').title = 'If the 3DS does not find this server by itself, enter one of these addresses';
  const sc = state.scan;
  $('#scanbtn').disabled = sc.running;
  $('#scanbar').hidden = !sc.running;
  if (sc.running) {
    $('#scanbar div').style.width = (sc.total ? 100 * sc.done / sc.total : 5) + '%';
    $('#scanline').textContent = `Scanning ${sc.library || ''}: ${sc.done}/${sc.total}  ${sc.current || ''}`.slice(0, 90);
  } else {
    $('#scanline').textContent = sc.error ? 'Scan problem: ' + sc.error
      : sc.last ? `Last scan ${new Date(sc.last * 1000).toLocaleTimeString()}` + (sc.added ? ` · ${sc.added} new` : '') : '';
  }
  renderLibs();
  renderUpdate();
  renderFF();
  return sc.running || (state.ffmpeg && !!state.ffmpeg.state);
}

function renderUpdate() {
  const u = state.update || {};
  const bar = $('#updbar');
  if (!u.available && u.state !== 'downloading' && u.state !== 'restarting') { bar.hidden = true; return; }
  bar.hidden = false;

  $('#updbtn').disabled = !!u.state;
  const mb = n => (n / 1048576).toFixed(1);
  const pct = u.total ? Math.floor(100 * (u.done || 0) / u.total) : 0;
  $('#updprog').hidden = u.state !== 'downloading';
  $('#updprog div').style.width = pct + '%';
  $('#updtext').textContent =
    u.state === 'downloading' ? `Downloading Big Top ${u.latest}… ${pct}% (${mb(u.done || 0)} of ${mb(u.total || 0)} MB)` :
    u.state === 'restarting'  ? `Starting Big Top ${u.latest}…` :
    u.error ? `Big Top ${u.latest} is available (last try failed: ${u.error})` :
    `Big Top ${u.latest} is available (you have ${u.current}).`;
}

// release notes (GitHub markdown) shown here, lightly formatted: headings, bold, code, links, lists
function mdLite(md) {
  return esc(md || '').split('\n').map(line => {
    let l = line
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent2)">$1</a>');
    if (/^#{1,6}\s/.test(l)) return '<h4 style="margin:14px 0 4px">' + l.replace(/^#{1,6}\s/, '') + '</h4>';
    if (/^\|[\s\-:|]+$/.test(line)) return '';   // a table's divider row
    if (/^\|/.test(l)) return '<div style="font-size:13px;color:var(--dim)">' + l.replace(/\|/g, ' ').trim() + '</div>';
    if (/^\s*[-*•]\s/.test(l)) return '<div style="margin-left:14px">• ' + l.replace(/^\s*[-*•]\s/, '') + '</div>';
    return l.trim() ? '<p style="margin:6px 0">' + l + '</p>' : '';
  }).join('');
}
function notesDialog() {
  const u = state.update || {};
  open(`
    <h3>Big Top ${esc(u.latest || '')}</h3>
    <div class="hint">You have ${esc(u.current || '')}.</div>
    <div style="margin-top:10px">${u.notes ? mdLite(u.notes) : '<p class="hint">No notes came with this release.</p>'}</div>
    <div class="actions">
      ${u.page ? `<a href="${esc(u.page)}" target="_blank" rel="noopener" style="margin-right:auto;color:var(--accent2);align-self:center">Open on GitHub</a>` : ''}
      <button id="ncancel">Close</button>${u.available && !u.state ? '<button class="primary" id="nupdate">Update now</button>' : ''}
    </div>`);
  $('#ncancel').onclick = close;
  if ($('#nupdate')) $('#nupdate').onclick = () => { close(); $('#updbtn').click(); };
}

// after Update now: wait for the new version to answer, then reload the page from it
async function waitForNewVersion(oldVersion) {
  for (let i = 0; i < 240; i++) {
    await new Promise(r => setTimeout(r, 750));
    try {
      const st = await api('GET', '/admin/api/state');
      if (st.version !== oldVersion) { location.reload(); return; }
      state = st; renderUpdate();
      if (!st.update.state && st.update.error) return;   // the download failed: the banner says why
    } catch (e) { $('#updprog').hidden = true; $('#updtext').textContent = 'Starting the new Big Top… this page reloads by itself.'; }
  }
}

function renderLibs() {
  const box = $('#libs');
  if (!state.libraries.length) {
    box.innerHTML = '<div class="card empty">No libraries yet. Add one and choose the folders where your videos are (.moflex, and MP4/MKV/AVI with FFmpeg).</div>';
  } else {
    box.innerHTML = state.libraries.map(l => `
      <div class="card lib">
        <div class="grow"><div class="name">${esc(l.name)}</div>
          <div class="folders">${l.folders.map(esc).join('<br>')}</div></div>
        <span class="pill">${l.videos} videos${l.missing ? ` · ${l.missing} missing` : ''}</span>
        <button class="small" data-edit="${l.id}">Edit</button>
      </div>`).join('');
    box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => libDialog(state.libraries.find(l => l.id === b.dataset.edit)));
  }
  const tabs = $('#tabs');
  if (!curLib && state.libraries.length) curLib = state.libraries[0].id;
  tabs.innerHTML = state.libraries.map(l => `<button data-lib="${l.id}" class="${l.id === curLib ? 'on' : ''}">${esc(l.name)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => { curLib = b.dataset.lib; renderLibs(); loadLib(); });
}

async function loadLib() {
  if (!curLib) { $('#grid').innerHTML = ''; return; }
  libData = await api('GET', `/admin/api/libraries/${curLib}/items`);
  renderGrid();
}

function renderGrid() {
  const q = $('#search').value.trim().toLowerCase();
  const tiles = [];
  for (const it of libData.items) {
    if (it.missing || it.showId) continue;
    tiles.push({ kind: 'item', id: it.id, title: it.info.title, sub: it.info.year || '', poster: it.poster, is3d: ['3d', 'hsbs', 'fsbs'].includes(it.info.is3d), src: it.source, sup: it.super });
  }
  for (const sh of libData.shows) {
    const eps = libData.items.filter(i => i.showId === sh.id && !i.missing).length;
    if (!eps) continue;
    tiles.push({ kind: 'show', id: sh.id, title: sh.info.title, sub: `${eps} episodes`, poster: sh.poster, src: 'show' });
  }
  const shown = tiles.filter(t => !q || (t.title || '').toLowerCase().includes(q))
                     .sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  if (!shown.length) { $('#grid').innerHTML = `<div class="empty">${curLib ? 'Nothing here yet.' : ''}</div>`; return; }
  $('#grid').innerHTML = shown.map(t => {
    const url = t.kind === 'show' ? `/api/shows/${t.id}/poster?w=280&h=400&v=${bust}` : `/api/items/${t.id}/poster?w=280&h=400&v=${bust}`;
    const tag = t.sup ? '<span class="badge r bsup">SUPER</span>' : t.src === 'filename' ? '<span class="badge r bfn" title="Only the file name was recognised">CHECK</span>' : '';
    return `<div class="tile" data-kind="${t.kind}" data-id="${t.id}">
      <div class="art" style="${t.poster ? `background-image:url('${url}')` : ''}">
        ${t.poster ? '' : `<div class="none">${esc(t.title)}</div>`}
        ${t.is3d ? '<span class="badge b3d">3D</span>' : ''}${tag}
      </div>
      <div class="t" title="${esc(t.title)}">${esc(t.title)}</div><div class="s">${esc(t.sub)}</div></div>`;
  }).join('');
  $('#grid').querySelectorAll('.tile').forEach(el => el.onclick = () =>
    el.dataset.kind === 'show' ? showDialog(el.dataset.id) : itemDialog(el.dataset.id));
}

// ---------- dialogs ----------
const dlg = $('#dlg');
function open(html) { $('#dlgbody').innerHTML = html; if (!dlg.open) dlg.showModal(); }
function close() { dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg) close(); });

function field(id, labelText, value, placeholder, type = 'text') {
  return `<label for="${id}">${labelText}</label><input id="${id}" type="${type}" value="${esc(value || '')}" placeholder="${esc(placeholder || '')}">`;
}

// Library add / edit, with a folder browser
function libDialog(lib) {
  const folders = lib ? [...lib.folders] : [];
  const draw = () => open(`
    <h3>${lib ? 'Edit library' : 'Add a library'}</h3>
    ${field('lname', 'Name (what the 3DS shows)', lib ? lib.name : '', 'Movies, 3D Movies, Cartoons…')}
    <label>Folders</label>
    <div id="flist">${folders.map((f, i) => `<div class="row" style="margin:4px 0"><span style="overflow-wrap:anywhere">${esc(f)}</span>
       <button class="small" style="flex:none" data-rm="${i}">Remove</button></div>`).join('') || '<div class="hint">None yet.</div>'}</div>
    <p><button id="browse">+ Add a folder…</button></p>
    <div id="browser"></div>
    <div class="err" id="lerr"></div>
    <div class="actions">
      ${lib ? '<button id="ldel" style="margin-right:auto">Remove library</button>' : ''}
      <button id="lcancel">Cancel</button><button class="primary" id="lsave">${lib ? 'Save' : 'Add and scan'}</button>
    </div>`);
  const hook = () => {
    $('#flist').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { folders.splice(+b.dataset.rm, 1); keepName(); draw(); hook(); });
    $('#browse').onclick = () => browse('');
    $('#lcancel').onclick = close;
    if (lib) $('#ldel').onclick = async () => {
      if (!confirm(`Remove "${lib.name}" from Big Top? The video files stay where they are.`)) return;
      await api('DELETE', `/admin/api/libraries/${lib.id}`); close(); curLib = null; refresh();
    };
    $('#lsave').onclick = async () => {
      try {
        const body = { name: $('#lname').value, folders };
        if (lib) await api('PUT', `/admin/api/libraries/${lib.id}`, body);
        else { const r = await api('POST', '/admin/api/libraries', body); curLib = r.id; }
        close(); refresh(); poll();
      } catch (e) { $('#lerr').textContent = e.message; }
    };
  };
  let nameKeep = lib ? lib.name : '';
  const keepName = () => { nameKeep = $('#lname').value; };
  const browse = async path => {
    keepName();
    try {
      const d = await api('GET', '/admin/api/browse?path=' + encodeURIComponent(path));
      $('#browser').innerHTML = `<div class="card">
        <div class="row"><b style="overflow-wrap:anywhere">${esc(d.path || 'Choose a drive or folder')}</b>
          ${d.path ? `<button class="small primary" style="flex:none" id="pick">Use this folder${d.videos ? ` (${d.videos} videos here)` : ''}</button>` : ''}</div>
        <div class="picker">
          ${d.path ? `<div data-p="${esc(d.parent)}">⬆ Up</div>` : ''}
          ${d.dirs.map(x => `<div data-p="${esc(x.path)}">📁 ${esc(x.name)}</div>`).join('') || '<div>No folders inside.</div>'}
        </div></div>`;
      $('#browser').querySelectorAll('[data-p]').forEach(el => el.onclick = () => browse(el.dataset.p));
      if (d.path) $('#pick').onclick = () => { if (!folders.includes(d.path)) folders.push(d.path); draw(); $('#lname').value = nameKeep; hook(); };
    } catch (e) { $('#lerr').textContent = e.message; }
  };
  draw(); hook();
}

// moflex holds its own stereo layout: 2D or 3D. Other formats must say how the frame splits.
const is3dSel = (v, moflex, detected) => {
  const opts = moflex ? [['2d', '2D'], ['3d', '3D']] : [['2d', '2D'], ['hsbs', '3D Half SBS'], ['fsbs', '3D Full SBS']];
  const name = { '2d': '2D', '3d': '3D', hsbs: '3D Half SBS', fsbs: '3D Full SBS' };
  return `<select id="e3d"><option value="">As detected (${name[detected] || '2D'})</option>` +
    opts.map(([k, t]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${t}</option>`).join('') + '</select>';
};
const srcText = { super: 'its super moflex info', catalog: 'the Clownsec catalog', filename: 'its file name only' };

function itemDialog(id) {
  const it = libData.items.find(x => x.id === id); if (!it) return;
  const d = it.detected, e = it.edit, ep = !!it.showId;
  const art = it.poster ? `background-image:url('/api/items/${id}/poster?w=340&h=486&v=${bust}')` : '';
  open(`
    <h3>${esc(it.info.title || 'Untitled')}</h3>
    <div class="path">${esc(it.path)}</div>
    <div class="hint">Recognised from ${srcText[it.source] || it.source}. Leave a field empty to use what was detected (shown faded).</div>
    <div class="edit">
      <div><div class="art" style="${art}"></div>
        <p><label class="btn" style="text-align:center;display:block;cursor:pointer">Upload poster…<input type="file" id="pfile" accept="image/*" hidden></label></p>
        <div class="hint">${it.posterBy ? 'Poster from ' + ({super: 'the file', catalog: 'the catalog', user: 'you'}[it.posterBy] || it.posterBy) : 'No poster'}</div></div>
      <div>
        ${ep ? `<div class="row"><div>${field('eshow', 'Show', e.show, d.show)}</div><div>${field('eseason', 'Season', e.season || '', d.season, 'number')}</div><div>${field('eep', 'Episode', e.episode || '', d.episode, 'number')}</div></div>` : ''}
        <div class="row"><div>${field('etitle', ep ? 'Episode title' : 'Title', ep ? e.epTitle : e.title, ep ? d.epTitle : d.title)}</div>
          ${ep ? '' : `<div style="max-width:110px">${field('eyear', 'Year', e.year || '', d.year, 'number')}</div>`}</div>
        <label for="esum">Summary</label><textarea id="esum" placeholder="${esc(d.summary)}">${esc(e.summary)}</textarea>
        <div class="row"><div>${field('egen', 'Genres', e.genres, d.genres)}</div>
          <div style="max-width:110px">${field('erun', 'Minutes', e.runtime || '', d.runtime, 'number')}</div>
          <div style="max-width:190px"><label for="e3d">3D</label>${is3dSel(e.is3d, it.moflex, d.is3d)}</div></div>
        ${ep ? '' : `<label>Not the right movie? Find it in the Clownsec catalog</label>
          <div class="row"><input id="cq" placeholder="Search the catalog…" value="${esc(it.info.title)}"><button id="cgo" style="flex:none">Search</button></div>
          <div id="cres"></div>`}
      </div>
    </div>
    <div class="err" id="eerr"></div>
    <div class="actions"><button id="ereset" style="margin-right:auto">Clear my edits</button><button id="ecancel">Cancel</button><button class="primary" id="esave">Save</button></div>`);
  const num = v => parseInt(v, 10) || 0;
  const collect = () => ep
    ? { show: $('#eshow').value.trim(), season: num($('#eseason').value), episode: num($('#eep').value),
        epTitle: $('#etitle').value.trim(), title: $('#etitle').value.trim(),
        summary: $('#esum').value.trim(), genres: $('#egen').value.trim(), runtime: num($('#erun').value), is3d: $('#e3d').value }
    : { title: $('#etitle').value.trim(), year: num($('#eyear').value), summary: $('#esum').value.trim(),
        genres: $('#egen').value.trim(), runtime: num($('#erun').value), is3d: $('#e3d').value };
  $('#ecancel').onclick = close;
  $('#esave').onclick = async () => { try { await api('PUT', `/admin/api/items/${id}`, collect()); close(); loadLib(); } catch (x) { $('#eerr').textContent = x.message; } };
  $('#ereset').onclick = async () => { await api('PUT', `/admin/api/items/${id}`, {}); close(); loadLib(); };
  $('#pfile').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { await api('POST', `/admin/api/items/${id}/poster`, f, true); bust = Date.now(); await loadLib(); itemDialog(id); }
    catch (x) { $('#eerr').textContent = x.message; }
  };
  if (!ep) {
    const search = async () => {
      const r = await api('GET', '/admin/api/catalog?q=' + encodeURIComponent($('#cq').value));
      $('#cres').innerHTML = `<div class="picker">${r.map(c => `<div data-c="${esc(c.id)}"><img src="${esc(c.art)}" alt="" loading="lazy">
        <span>${esc(c.title)} (${c.year})${c.type === 'tvshow' ? ' · TV' : ''}</span></div>`).join('') || '<div>No match in the catalog.</div>'}</div>`;
      $('#cres').querySelectorAll('[data-c]').forEach(el => el.onclick = async () => {
        await api('POST', `/admin/api/items/${id}/match?catalog=` + encodeURIComponent(el.dataset.c));
        bust = Date.now(); await loadLib(); itemDialog(id);
      });
    };
    $('#cgo').onclick = search;
    $('#cq').onkeydown = ev => { if (ev.key === 'Enter') search(); };
  }
}

function showDialog(sid) {
  const sh = libData.shows.find(x => x.id === sid); if (!sh) return;
  const eps = libData.items.filter(i => i.showId === sid && !i.missing)
    .sort((a, b) => (a.info.season - b.info.season) || (a.info.episode - b.info.episode));
  const d = sh.detected, e = sh.edit;
  const art = sh.poster ? `background-image:url('/api/shows/${sid}/poster?w=340&h=486&v=${bust}')` : '';
  open(`
    <h3>${esc(sh.info.title)}</h3>
    <div class="edit">
      <div><div class="art" style="${art}"></div>
        <p><label class="btn" style="text-align:center;display:block;cursor:pointer">Upload poster…<input type="file" id="pfile" accept="image/*" hidden></label></p></div>
      <div>
        <div class="row"><div>${field('stitle', 'Show title (shown on the 3DS)', e.title, d.title)}</div>
          <div style="max-width:110px">${field('syear', 'Year', e.year || '', d.year, 'number')}</div></div>
        <label for="ssum">Summary</label><textarea id="ssum" placeholder="${esc(d.summary)}">${esc(e.summary)}</textarea>
        ${field('sgen', 'Genres', e.genres, d.genres)}
        <div class="hint">To move an episode to another show, edit the episode's Show field.</div>
      </div>
    </div>
    <div class="eps">${eps.map(x => `<div class="ep"><span class="n">S${x.info.season}·E${x.info.episode}</span>
      <span class="x">${esc(x.info.epTitle || x.info.title || '')}</span><button class="small" data-ep="${x.id}">Edit</button></div>`).join('')}</div>
    <div class="err" id="serr"></div>
    <div class="actions"><button id="scancel">Close</button><button class="primary" id="ssave">Save show</button></div>`);
  $('#scancel').onclick = close;
  $('#ssave').onclick = async () => {
    try { await api('PUT', `/admin/api/shows/${sid}`, { title: $('#stitle').value.trim(), year: parseInt($('#syear').value, 10) || 0,
      summary: $('#ssum').value.trim(), genres: $('#sgen').value.trim() }); close(); loadLib(); }
    catch (x) { $('#serr').textContent = x.message; }
  };
  $('#pfile').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { await api('POST', `/admin/api/shows/${sid}/poster`, f, true); bust = Date.now(); await loadLib(); showDialog(sid); }
    catch (x) { $('#serr').textContent = x.message; }
  };
  document.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => itemDialog(b.dataset.ep));
}

function settingsDialog() {
  open(`
    <h3>Settings</h3>
    ${field('sname', 'Server name (what the 3DS lists)', state.name)}
    <label><input type="checkbox" id="sremote" style="width:auto" ${state.allowRemoteAdmin ? 'checked' : ''}>
      Allow this setup page from other computers on the network</label>
    <div class="hint">Off: only this computer can change libraries and edit info. Watching from a 3DS works either way.</div>
    <p class="hint">Version ${esc(state.version)} · <a href="#" id="updcheck" style="color:var(--accent2)">check for updates</a>
      <span id="updres"></span></p>
    <p class="hint">FFmpeg (MP4/MKV/AVI): ${state.ffmpeg && state.ffmpeg.found ? esc(state.ffmpeg.version || 'found') + ' · ' + esc(state.ffmpeg.ffmpeg) : 'not found'}</p>
    <p class="hint">Clownsec catalog: ${state.catalog.movies} movies, ${state.catalog.shows} shows ·
      <a href="#" id="refresh" style="color:var(--accent2)">re-read every file's info</a></p>
    <div class="err" id="xerr"></div>
    <div class="actions"><button id="xcancel">Cancel</button><button class="primary" id="xsave">Save</button></div>`);
  $('#xcancel').onclick = close;
  $('#updcheck').onclick = async ev => {
    ev.preventDefault(); $('#updres').textContent = ' checking…';
    try { const u = await api('POST', '/admin/api/update/check');
          $('#updres').textContent = u.available ? ` — ${u.latest} is available (see the bar at the top)` : ' — this is the latest version';
          await loadState(); }
    catch (x) { $('#updres').textContent = ' — ' + x.message; }
  };
  $('#refresh').onclick = async ev => { ev.preventDefault(); await api('POST', '/admin/api/scan?refresh=1'); close(); poll(); };
  $('#xsave').onclick = async () => {
    try { await api('PUT', '/admin/api/settings', { name: $('#sname').value, allowRemoteAdmin: $('#sremote').checked }); close(); refresh(); }
    catch (x) { $('#xerr').textContent = x.message; }
  };
}

// FFmpeg: MP4/MKV/AVI are transcoded for the 3DS; moflex plays without it.
function renderFF() {
  const f = state.ffmpeg || {};
  const busy = !!f.state;
  $('#ffbar').hidden = f.found && !busy && !f.error;
  if ($('#ffbar').hidden) return;
  $('#ffprog').hidden = !busy;
  $('#ffbtn').hidden = busy || !f.canDownload;
  if (busy) {
    $('#ffprog div').style.width = (f.total ? 100 * f.done / f.total : 5) + '%';
    $('#fftext').textContent = f.state === 'unpacking' ? 'Unpacking FFmpeg…'
      : `Downloading FFmpeg… ${Math.round((f.done || 0) / 1048576)} of ${Math.round((f.total || 0) / 1048576) || '?'} MB`;
  } else if (f.error) {
    $('#fftext').textContent = 'The FFmpeg download didn\'t work: ' + f.error;
  } else {
    $('#fftext').textContent = 'MP4, MKV and AVI videos need FFmpeg to play on the 3DS (moflex doesn\'t). ' +
      (f.problem ? f.problem + '.' : f.canDownload ? 'Big Top can download it for you (about 115 MB).' : (f.hint || '') + ', then restart Big Top.');
  }
}
$('#ffbtn').onclick = async () => {
  try { await api('POST', '/admin/api/ffmpeg/download'); poll(); }
  catch (x) { $('#fftext').textContent = x.message; }
};

// ---------- wiring ----------
$('#addlib').onclick = () => libDialog(null);
$('#setbtn').onclick = settingsDialog;
$('#updnotes').onclick = ev => { ev.preventDefault(); notesDialog(); };
$('#updbtn').onclick = async () => {
  try { await api('POST', '/admin/api/update'); $('#updbtn').disabled = true; $('#updtext').textContent = 'Downloading…';
        waitForNewVersion(state.version); }
  catch (x) { $('#updtext').textContent = x.message; }
};
$('#quitbtn').onclick = async () => {
  if (!confirm('Stop Big Top? The 3DS can\'t watch until you start it again.')) return;
  try { await api('POST', '/admin/api/quit'); } catch (e) {}
  document.body.innerHTML = '<main><h2>Big Top has stopped.</h2><p class="hint">Start it again to keep watching.</p></main>';
};
$('#scanbtn').onclick = async () => { await api('POST', '/admin/api/scan'); poll(); };
$('#search').oninput = renderGrid;

let polling = false;
async function poll() {
  if (polling) return; polling = true;
  try {
    let tick = 0;
    while (await loadState()) { if (++tick % 3 === 0) loadLib(); await new Promise(r => setTimeout(r, 1500)); }
    bust = Date.now(); await loadLib();
  } finally { polling = false; }
}
async function refresh() { await loadState(); await loadLib(); }
refresh().then(() => { if (state.scan.running) poll(); });
</script>
