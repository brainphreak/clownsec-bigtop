<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- "Add to Home Screen" opens Big Top without the browser's bars (an iPhone's only full screen for 3D) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Big Top">
<title>Clownsec Big Top</title>
<style>
:root {
  --bg: #0f0d14; --panel: #1a1622; --panel2: #231d2e; --line: #352c45;
  --ink: #eee8f6; --dim: #a397b5; --accent: #ff3d6e; --accent2: #ffc23d; --ok: #4ade80; --warn: #fbbf24;
  --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.logo { font-weight: 800; font-size: 20px; letter-spacing: .3px; }
.logo b { color: var(--accent); }
.logo i { color: var(--accent2); font-style: normal; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); }
.grow { flex: 1; }
main { max-width: 1280px; margin: 0 auto; padding: 18px 22px 60px; }
h2 { font-size: 16px; margin: 26px 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
button, .btn { font: inherit; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer; }
button:hover { border-color: var(--dim); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.small { padding: 4px 9px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
input, textarea, select { font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 0; }
.libs { display: grid; gap: 10px; }
.lib { display: flex; gap: 12px; align-items: center; }
.lib .name { font-weight: 700; }
.lib .folders { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
.tile { cursor: pointer; }
.tile .art { aspect-ratio: 175 / 250; border-radius: 8px; background: var(--panel2) center/cover no-repeat; border: 1px solid var(--line); position: relative; overflow: hidden; }
.tile .art .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 12px; padding: 8px; text-align: center; }
.tile .t { font-size: 13px; margin-top: 6px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .s { font-size: 12px; color: var(--dim); }
.badge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: #000a; }
.badge.r { left: auto; right: 6px; }
.b3d { color: var(--accent2); } .bsup { color: var(--ok); } .bfn { color: var(--warn); }
.status { color: var(--dim); font-size: 13px; }
.bar { height: 4px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: #000b; }
.dlg { padding: 18px 20px; overflow: auto; max-height: calc(100vh - 40px); }
.dlg h3 { margin: 0 0 4px; }
.dlg .path { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.edit { display: grid; grid-template-columns: 170px 1fr; gap: 18px; margin-top: 12px; }
@media (max-width: 640px) { .edit { grid-template-columns: 1fr; } }
.edit .art { aspect-ratio: 175 / 250; border-radius: 8px; background: var(--panel2) center/cover no-repeat; border: 1px solid var(--line); }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--dim); }
[hidden] { display: none !important; }
/* another device without "allow remote admin": browse and watch only */
body.viewer .admin { display: none !important; }   /* an inline display:flex would beat the hidden attribute */
.picker { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; }
.picker div { padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
.picker div:hover { background: var(--panel2); }
.picker img { width: 34px; height: 48px; object-fit: cover; border-radius: 4px; background: var(--panel2); }
.eps { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.ep { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 14px; }
.ep .n { color: var(--dim); width: 64px; flex: none; }
.ep .x { flex: 1; }
.err { color: var(--accent); font-size: 13px; margin-top: 8px; min-height: 1em; }
.empty { color: var(--dim); padding: 30px; text-align: center; }
/* browsing: filters, genres, A-Z, the detail view */
.filters { display: grid; gap: 10px; margin-bottom: 16px; }
.filters > * { min-width: 0; }   /* a scrolling row must not widen the page */
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chips .lbl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin-right: 2px; }
.chip { font-size: 13px; padding: 4px 11px; border-radius: 99px; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .c { opacity: .65; font-size: 11px; margin-left: 5px; }
.letters { display: flex; gap: 3px; flex-wrap: wrap; }
.letters button { padding: 3px 0; min-width: 30px; font-size: 12px; border-radius: 6px; }
.letters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.filters select { width: auto; padding: 4px 8px; font-size: 13px; }
.count { font-size: 13px; color: var(--dim); }
@media (max-width: 640px) {
  .scrollrow { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .scrollrow::-webkit-scrollbar { display: none; }
  .scrollrow > * { flex: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  main { padding: 14px 16px 60px; }
  header { padding: 12px 16px; gap: 10px; }
  .lib { flex-wrap: wrap; }
}
.tile .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
.tile .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #0008; }
.tile .prog div { height: 100%; background: var(--accent); }
.seen { position: absolute; right: 6px; bottom: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--ok); color: #062; font-size: 14px; font-weight: 900; display: grid; place-items: center; box-shadow: 0 1px 4px #0008; }
.tile.watched .art img { opacity: .55; }
.ep .ck { width: 18px; flex: none; color: var(--ok); font-weight: 900; text-align: center; }
.ep .bar2 { width: 40px; height: 4px; background: var(--panel2); border-radius: 3px; overflow: hidden; flex: none; }
.ep .bar2 div { height: 100%; background: var(--accent); }
.detail { display: grid; grid-template-columns: 200px 1fr; gap: 20px; margin-top: 4px; }
.detail .art { aspect-ratio: 175 / 250; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; }
.detail .art img { width: 100%; height: 100%; object-fit: fill; display: block; }
.detail h3 { font-size: 22px; margin: 0 0 6px; }
.meta { color: var(--dim); font-size: 13px; display: flex; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 10px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.detail p.sum { margin: 0 0 12px; white-space: pre-line; }
.seasons { margin-top: 12px; }
.seasons h4 { margin: 14px 0 4px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; }
@media (max-width: 640px) { .detail { grid-template-columns: 110px 1fr; gap: 14px; } .detail h3 { font-size: 18px; } }
.ep .play { flex: none; }
/* the player */
#player { position: fixed; inset: 0; z-index: 1000; background: #000; color: #fff; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#pstage { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
#pvid, #pcan { grid-area: 1 / 1; max-width: 100%; max-height: 100%; }
#pvid { width: 100%; height: 100%; object-fit: contain; background: #000; }
#pvid.under { opacity: 0; pointer-events: none; }
#pcan { display: block; }
/* subtitles: one box per eye, laid over the picture */
#psubs { position: absolute; inset: 0; pointer-events: none; }
#psubs .eye { position: absolute; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
#psubs .ln { color: #fff; text-align: center; line-height: 1.25; font-weight: 600; white-space: pre-line; padding: 0 4%;
  text-shadow: 0 0 3px #000, 0 0 3px #000, 1px 1px 2px #000, -1px -1px 2px #000; }
#psubs .sq { transform: scaleX(.5); transform-origin: center bottom; }  /* half SBS: squeezed like the picture */
#player.idle #psubs .eye { transition: none; }
.pui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; transition: opacity .25s; }
#player.idle .pui { opacity: 0; cursor: none; }
.ptop { display: flex; gap: 10px; align-items: center; padding: max(12px, env(safe-area-inset-top)) 16px 30px; background: linear-gradient(#000c, #0000); }
.ptop .ttl { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pbot { padding: 30px 16px max(12px, env(safe-area-inset-bottom)); background: linear-gradient(#0000, #000d); }
.pbtn { background: #fff1; border: 1px solid #fff3; color: #fff; border-radius: 8px; padding: 6px 11px; font-size: 14px; min-width: 40px; }
.pbtn:hover { background: #fff2; border-color: #fff6; }
.pbtn.on { background: var(--accent); border-color: var(--accent); }
.prow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.ptime { font-size: 13px; font-variant-numeric: tabular-nums; color: #ddd; white-space: nowrap; }
#pseek { width: 100%; accent-color: var(--accent); padding: 0; border: 0; background: none; height: 22px; }
#pvol { width: 90px; accent-color: var(--accent); padding: 0; border: 0; background: none; }
.pcenter { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.pspin { width: 46px; height: 46px; border: 4px solid #fff3; border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pmsg { background: #000c; padding: 12px 16px; border-radius: 10px; max-width: min(520px, 90vw); text-align: center; pointer-events: auto; }
.pmenu { position: absolute; right: 16px; bottom: 86px; background: #16121ef2; border: 1px solid #fff2; border-radius: 12px; padding: 10px 12px; width: min(300px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; }
.pmenu h5 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #aaa; }
.pmenu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: #fff; padding: 7px 8px; border-radius: 6px; font-size: 14px; }
.pmenu button:hover { background: #fff1; }
.pmenu button.on { background: var(--accent); }
.pmenu button:disabled { opacity: .4; }
.pmenu .hint { color: #aaa; padding: 4px 8px; }
@media (max-width: 640px) { #pvol { display: none; } .pbtn { padding: 6px 9px; min-width: 36px; } .hide-sm { display: none; } }
@media (hover: none) { #pvol { display: none; } }
</style>
</head>
<body>
<header>
  <div class="logo"><b>Clownsec</b> <i>Big Top</i></div>
  <span class="pill" id="srvname">…</span>
  <span class="pill admin" id="addr"></span>
  <div class="grow"></div>
  <span class="status admin" id="scanline"></span>
  <button id="scanbtn" class="admin">Scan for new videos</button>
  <button id="setbtn" class="admin">Settings</button>
  <button id="quitbtn" class="admin" title="Stop Big Top">Quit</button>
</header>
<div id="updbar" class="admin" hidden style="background:var(--panel2);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <span id="updtext"></span>
  <div id="updprog" class="bar" hidden style="width:180px;margin:0"><div></div></div>
  <div class="grow"></div>
  <a id="updnotes" href="#" style="color:var(--accent2)">What's new</a>
  <button class="primary" id="updbtn">Update now</button>
</div>
<div id="ffbar" class="admin" hidden style="background:var(--panel2);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <span id="fftext"></span>
  <div id="ffprog" class="bar" hidden style="width:180px;margin:0"><div></div></div>
  <div class="grow"></div>
  <button class="primary" id="ffbtn" hidden>Download FFmpeg</button>
</div>
<main>
  <div class="bar" id="scanbar" hidden><div></div></div>

  <div class="admin">
  <h2>Libraries</h2>
  <div class="libs" id="libs"></div>
  <p><button class="primary" id="addlib">+ Add a library</button></p>
  </div>

  <h2>Browse</h2>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters">
    <input id="search" type="search" placeholder="Search titles, genres, years…" autocomplete="off">
    <div class="chips scrollrow" id="fkind"></div>
    <div class="chips scrollrow">
      <span class="lbl">Sort</span>
      <select id="fsort"><option value="added">Recently added</option><option value="title">Name</option>
        <option value="year">Year (newest)</option><option value="yearAsc">Year (oldest)</option><option value="runtime">Length</option></select>
      <span class="lbl" style="margin-left:8px">Show</span>
      <span id="f3d"></span>
      <button class="chip" id="fsup" title="Only super moflex files">Super only</button>
      <button class="chip" id="funw" title="Hide what you've watched (in this browser)">Unwatched</button>
      <span class="grow"></span>
      <span class="count" id="fcount"></span>
      <button class="chip" id="fclear" hidden>Clear filters</button>
    </div>
    <div class="chips scrollrow" id="fgenre"></div>
    <div class="letters scrollrow" id="fletter"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

<div id="player" hidden>
  <div id="pstage"><video id="pvid" playsinline webkit-playsinline preload="auto"></video><canvas id="pcan" hidden></canvas><div id="psubs"></div></div>
  <div class="pcenter"><div class="pspin" id="pspin" hidden></div></div>
  <div class="pcenter"><div class="pmsg" id="pmsg" hidden></div></div>
  <div class="pui" id="pui">
    <div class="ptop"><button class="pbtn" id="pclose" title="Close (Esc)">✕</button><span class="ttl" id="ptitle"></span></div>
    <div class="pbot">
      <input type="range" id="pseek" min="0" max="1000" value="0" step="1">
      <div class="prow">
        <button class="pbtn" id="pplay" title="Play / pause (space)">▶</button>
        <button class="pbtn hide-sm" id="pback" title="Back 10 s (←)">−10</button>
        <button class="pbtn hide-sm" id="pfwd" title="Forward 10 s (→)">+10</button>
        <span class="ptime" id="ptime">0:00</span>
        <span class="grow"></span>
        <input type="range" id="pvol" min="0" max="1" step="0.05" value="1" title="Volume">
        <button class="pbtn" id="pcc" hidden title="Subtitles">CC</button>
        <button class="pbtn" id="paud" hidden title="Audio track / version">Audio</button>
        <button class="pbtn" id="p3d" title="3D view">3D</button>
        <button class="pbtn" id="pfs" title="Full screen (f)">⛶</button>
      </div>
    </div>
  </div>
  <div class="pmenu" id="pmenu" hidden></div>
</div>

<script>
// season 0 (the specials) after the numbered seasons, as on the 3DS
const seasonOrder = n => (n || 0) === 0 ? 1e9 : n;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method, url, body, raw) {
  const opt = { method, headers: {} };
  if (body !== undefined) {
    if (raw) opt.body = body; else { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
  }
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.text()) || ('HTTP ' + r.status));
  // an empty body (204, or the 202 that starts an update) is no answer, not broken JSON: parsing it
  // was the "JSON" error shown on every update from this page
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

let state = null, curLib = null, libData = { items: [], shows: [] }, bust = Date.now();

async function loadState() {
  state = await api('GET', '/admin/api/state');
  document.body.classList.toggle('viewer', !!state.viewer);
  $('#srvname').textContent = state.name;
  $('#addr').textContent = (state.addresses || []).join('  ·  ') || 'no network address';
  $('#addr').title = 'If the 3DS does not find this server by itself, enter one of these addresses';
  const sc = state.scan;
  $('#scanbtn').disabled = sc.running;
  $('#scanbar').hidden = !sc.running;
  if (sc.running) {
    $('#scanbar div').style.width = (sc.total ? 100 * sc.done / sc.total : 5) + '%';
    $('#scanline').textContent = `Scanning ${sc.library || ''}: ${sc.done}/${sc.total}  ${sc.current || ''}`.slice(0, 90);
  } else {
    $('#scanline').textContent = sc.error ? 'Scan problem: ' + sc.error
      : sc.last ? `Last scan ${new Date(sc.last * 1000).toLocaleTimeString()}` + (sc.added ? ` · ${sc.added} new` : '') : '';
  }
  renderLibs();
  renderUpdate();
  renderFF();
  return sc.running || (state.ffmpeg && !!state.ffmpeg.state);
}

function renderUpdate() {
  const u = state.update || {};
  const bar = $('#updbar');
  if (!u.available && u.state !== 'downloading' && u.state !== 'restarting') { bar.hidden = true; return; }
  bar.hidden = false;

  $('#updbtn').disabled = !!u.state;
  const mb = n => (n / 1048576).toFixed(1);
  const pct = u.total ? Math.floor(100 * (u.done || 0) / u.total) : 0;
  $('#updprog').hidden = u.state !== 'downloading';
  $('#updprog div').style.width = pct + '%';
  $('#updtext').textContent =
    u.state === 'downloading' ? `Downloading Big Top ${u.latest}… ${pct}% (${mb(u.done || 0)} of ${mb(u.total || 0)} MB)` :
    u.state === 'restarting'  ? `Starting Big Top ${u.latest}…` :
    u.error ? `Big Top ${u.latest} is available (last try failed: ${u.error})` :
    `Big Top ${u.latest} is available (you have ${u.current}).`;
}

// release notes (GitHub markdown) shown here, lightly formatted: headings, bold, code, links, lists
function mdLite(md) {
  return esc(md || '').split('\n').map(line => {
    let l = line
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent2)">$1</a>');
    if (/^#{1,6}\s/.test(l)) return '<h4 style="margin:14px 0 4px">' + l.replace(/^#{1,6}\s/, '') + '</h4>';
    if (/^\|[\s\-:|]+$/.test(line)) return '';   // a table's divider row
    if (/^\|/.test(l)) return '<div style="font-size:13px;color:var(--dim)">' + l.replace(/\|/g, ' ').trim() + '</div>';
    if (/^\s*[-*•]\s/.test(l)) return '<div style="margin-left:14px">• ' + l.replace(/^\s*[-*•]\s/, '') + '</div>';
    return l.trim() ? '<p style="margin:6px 0">' + l + '</p>' : '';
  }).join('');
}
function notesDialog() {
  const u = state.update || {};
  open(`
    <h3>Big Top ${esc(u.latest || '')}</h3>
    <div class="hint">You have ${esc(u.current || '')}.</div>
    <div style="margin-top:10px">${u.notes ? mdLite(u.notes) : '<p class="hint">No notes came with this release.</p>'}</div>
    <div class="actions">
      ${u.page ? `<a href="${esc(u.page)}" target="_blank" rel="noopener" style="margin-right:auto;color:var(--accent2);align-self:center">Open on GitHub</a>` : ''}
      <button id="ncancel">Close</button>${u.available && !u.state ? '<button class="primary" id="nupdate">Update now</button>' : ''}
    </div>`);
  $('#ncancel').onclick = close;
  if ($('#nupdate')) $('#nupdate').onclick = () => { close(); $('#updbtn').click(); };
}

// after Update now: wait for the new version to answer, then reload the page from it
async function waitForNewVersion(oldVersion) {
  for (let i = 0; i < 240; i++) {
    await new Promise(r => setTimeout(r, 750));
    try {
      const st = await api('GET', '/admin/api/state');
      if (st.version !== oldVersion) { location.reload(); return; }
      state = st; renderUpdate();
      if (!st.update.state && st.update.error) return;   // the download failed: the banner says why
    } catch (e) { $('#updprog').hidden = true; $('#updtext').textContent = 'Starting the new Big Top… this page reloads by itself.'; }
  }
}

function renderLibs() {
  const box = $('#libs');
  if (!state.libraries.length) {
    box.innerHTML = '<div class="card empty">No libraries yet. Add one and choose the folders where your videos are (.moflex, and MP4/MKV/AVI with FFmpeg).</div>';
  } else {
    box.innerHTML = state.libraries.map(l => `
      <div class="card lib">
        <div class="grow"><div class="name">${esc(l.name)}</div>
          <div class="folders">${l.folders.map(esc).join('<br>')}</div></div>
        <span class="pill">${l.videos} videos${l.missing ? ` · ${l.missing} missing` : ''}</span>
        <button class="small" data-edit="${l.id}">Edit</button>
      </div>`).join('');
    box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => libDialog(state.libraries.find(l => l.id === b.dataset.edit)));
  }
  const tabs = $('#tabs');
  if (!curLib && state.libraries.length) curLib = state.libraries[0].id;
  tabs.innerHTML = state.libraries.map(l => `<button data-lib="${l.id}" class="${l.id === curLib ? 'on' : ''}">${esc(l.name)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => { curLib = b.dataset.lib; renderLibs(); loadLib(); });

async function loadLib() {
  if (!curLib) { $('#grid').innerHTML = ''; return; }
  libData = await api('GET', `/admin/api/libraries/${curLib}/items?client=${encodeURIComponent(webClient)}`);
  renderGrid();
}

// ---------- browsing ----------
// The filters, kept between visits (per viewer, in this browser).
const F = Object.assign({ kind: 'all', d3: 'all', sup: false, unw: false, sort: 'added', genre: 'all', letter: 'all' },
  (() => { try { return JSON.parse(localStorage.getItem('bt.browse') || '{}'); } catch { return {}; } })());
const saveF = () => { try { localStorage.setItem('bt.browse', JSON.stringify(F)); } catch {} };
const KIND = { all: 'All', movie: 'Movies', tvshow: 'TV shows', musicvideo: 'Music videos', short: 'Shorts' };
const KIND1 = { movie: 'Movie', tvshow: 'TV show', musicvideo: 'Music video', short: 'Short', episode: 'Episode' };
const LETTERS = ['#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
// "The Matrix" files under M, as on clownsec.com
const sortTitle = t => (t || '').replace(/^(the|a|an)\s+/i, '').trim();
const letterOf = t => { const c = sortTitle(t).charAt(0).toUpperCase(); return c >= 'A' && c <= 'Z' ? c : '#'; };
const genresOf = g => (g || '').split(',').map(x => x.trim()).filter(Boolean);
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
const is3d = v => ['3d', 'hsbs', 'fsbs'].includes(v);

// how far this browser got: 0..1 (0 = not started, or finished)
function progOf(it) {
  if (it.watched || !it.pos) return 0;
  const d = it.dur || (it.info.runtime || 0) * 60000;
  return d ? Math.min(1, it.pos / d) : 0.02;
}

// every title of the library once: movies/shorts/music videos, and shows (their episodes inside)
function titles() {
  const out = [];
  for (const it of libData.items) {
    if (it.missing || it.showId) continue;
    out.push({ kind: it.kind || 'movie', id: it.id, title: it.info.title || 'Untitled', year: it.info.year || 0,
      genres: genresOf(it.info.genres), added: it.added || 0, runtime: it.info.runtime || Math.round((it.dur || 0) / 60000),
      is3d: is3d(it.info.is3d), sup: it.super, src: it.source, poster: it.poster, sum: it.info.summary || '',
      watched: !!it.watched, prog: progOf(it) });
  }
  for (const sh of libData.shows) {
    const eps = libData.items.filter(i => i.showId === sh.id && !i.missing);
    if (!eps.length) continue;
    out.push({ kind: 'tvshow', id: sh.id, title: sh.info.title || 'Untitled', year: sh.info.year || 0,
      genres: genresOf(sh.info.genres), added: Math.max(...eps.map(e => e.added || 0)), runtime: 0,
      is3d: eps.some(e => is3d(e.info.is3d)), sup: eps.some(e => e.super), src: 'show', poster: sh.poster,
      sum: sh.info.summary || '', eps: eps.length, seen: eps.filter(e => e.watched).length,
      watched: eps.every(e => e.watched), prog: eps.some(e => e.watched || e.pos) ? eps.filter(e => e.watched).length / eps.length : 0 });
  }
  return out;
}

function chip(label, on, data, count) {
  return `<button class="chip ${on ? 'on' : ''}" ${data}>${esc(label)}${count != null ? `<span class="c">${count}</span>` : ''}</button>`;
}

function renderGrid() {
  const all = titles();
  const q = $('#search').value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const match = t => words.every(w => t.title.toLowerCase().includes(w) || String(t.year) === w ||
    t.genres.some(g => g.toLowerCase().includes(w)));
  // each filter row counts what the *other* filters leave, so its numbers say what a click would show
  const pass = (t, skip) => (skip === 'kind' || F.kind === 'all' || t.kind === F.kind) &&
    (skip === 'd3' || F.d3 === 'all' || (F.d3 === '3d') === t.is3d) &&
    (!F.sup || t.sup) && (!F.unw || !t.watched) &&
    (skip === 'genre' || F.genre === 'all' || t.genres.includes(F.genre)) &&
    (skip === 'letter' || F.letter === 'all' || letterOf(t.title) === F.letter) &&
    (!words.length || match(t));

  const kinds = {}; all.filter(t => pass(t, 'kind')).forEach(t => kinds[t.kind] = (kinds[t.kind] || 0) + 1);
  if (F.kind !== 'all' && !all.some(t => t.kind === F.kind)) F.kind = 'all';
  const kn = Object.keys(KIND).filter(k => k === 'all' || all.some(t => t.kind === k));
  $('#fkind').innerHTML = kn.length > 2 || F.kind !== 'all'
    ? kn.map(k => chip(KIND[k], F.kind === k, `data-k="${k}"`, k === 'all' ? null : kinds[k] || 0)).join('') : '';

  const d3 = { '3d': 0, '2d': 0 }; all.filter(t => pass(t, 'd3')).forEach(t => d3[t.is3d ? '3d' : '2d']++);
  $('#f3d').innerHTML = [['all', 'All'], ['3d', '3D'], ['2d', '2D']]
    .map(([k, l]) => chip(l, F.d3 === k, `data-d="${k}"`, k === 'all' ? null : d3[k])).join(' ');
  $('#fsup').classList.toggle('on', F.sup);
  $('#funw').classList.toggle('on', F.unw);
  $('#fsup').hidden = !all.some(t => t.sup);

  const gc = {}; all.filter(t => pass(t, 'genre')).forEach(t => t.genres.forEach(g => gc[g] = (gc[g] || 0) + 1));
  const gAll = [...new Set(all.flatMap(t => t.genres))].sort((a, b) => a.localeCompare(b));
  if (F.genre !== 'all' && !gAll.includes(F.genre)) F.genre = 'all';
  $('#fgenre').innerHTML = gAll.length ? '<span class="lbl">Genre</span>' + chip('All', F.genre === 'all', 'data-g=""') +
    gAll.map(g => chip(g, F.genre === g, `data-g="${esc(g)}"`, gc[g] || 0)).join('') : '';

  const lc = {}; all.filter(t => pass(t, 'letter')).forEach(t => { const l = letterOf(t.title); lc[l] = (lc[l] || 0) + 1; });
  $('#fletter').innerHTML = `<button class="${F.letter === 'all' ? 'on' : ''}" data-l="all">All</button>` +
    LETTERS.map(l => `<button class="${F.letter === l ? 'on' : ''}" data-l="${l}" ${lc[l] || F.letter === l ? '' : 'disabled'}>${l}</button>`).join('');
  $('#fsort').value = F.sort;

  const by = {
    added: (a, b) => b.added - a.added,
    title: () => 0,
    year: (a, b) => b.year - a.year,
    yearAsc: (a, b) => (a.year || 9999) - (b.year || 9999),
    runtime: (a, b) => b.runtime - a.runtime,
  }[F.sort] || (() => 0);
  const shown = all.filter(t => pass(t)).sort((a, b) => by(a, b) || sortTitle(a.title).localeCompare(sortTitle(b.title)));
  const filtered = F.kind !== 'all' || F.d3 !== 'all' || F.sup || F.unw || F.genre !== 'all' || F.letter !== 'all' || words.length;
  $('#fcount').textContent = filtered ? `${shown.length} of ${all.length}` : `${all.length} titles`;
  $('#fclear').hidden = !filtered;

  if (!shown.length) { $('#grid').innerHTML = `<div class="empty">${!curLib ? '' : all.length ? 'Nothing matches these filters.' : 'Nothing here yet.'}</div>`; return; }
  $('#grid').innerHTML = shown.map(t => {
    const url = t.kind === 'tvshow' ? `/api/shows/${t.id}/poster?w=280&h=400&v=${bust}` : `/api/items/${t.id}/poster?w=280&h=400&v=${bust}`;
    const tag = t.sup ? '<span class="badge r bsup">SUPER</span>' : t.src === 'filename' && !state.viewer ? '<span class="badge r bfn" title="Only the file name was recognised">CHECK</span>' : '';
    const sub = t.kind === 'tvshow' ? (t.seen && !t.watched ? `${t.seen} of ${t.eps} watched` : `${t.eps} episode${t.eps === 1 ? '' : 's'}`) : (t.year || '');
    return `<div class="tile ${t.watched ? 'watched' : ''}" data-kind="${t.kind === 'tvshow' ? 'show' : 'item'}" data-id="${t.id}" tabindex="0">
      <div class="art">${t.poster ? `<img src="${url}" alt="" loading="lazy" decoding="async">` : `<div class="none">${esc(t.title)}</div>`}
        ${t.is3d ? '<span class="badge b3d">3D</span>' : ''}${tag}
        ${t.watched ? '<span class="seen" title="Watched">✓</span>' : t.prog ? `<div class="prog"><div style="width:${Math.max(3, t.prog * 100)}%"></div></div>` : ''}</div>
      <div class="t" title="${esc(t.title)}">${esc(t.title)}</div><div class="s">${esc(sub)}</div></div>`;
  }).join('');
  $('#grid').querySelectorAll('.tile').forEach(el => {
    const go = () => el.dataset.kind === 'show' ? showDetail(el.dataset.id) : itemDetail(el.dataset.id);
    el.onclick = go;
    el.onkeydown = ev => { if (ev.key === 'Enter') go(); };
  });
}

function setF(k, v) { F[k] = v; saveF(); renderGrid(); }
$('#filters').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.k) setF('kind', b.dataset.k);
  else if (b.dataset.d) setF('d3', b.dataset.d);
  else if (b.dataset.g !== undefined) setF('genre', b.dataset.g || 'all');
  else if (b.dataset.l) setF('letter', b.dataset.l);
  else if (b.id === 'fsup') setF('sup', !F.sup);
  else if (b.id === 'funw') setF('unw', !F.unw);
  else if (b.id === 'fclear') { Object.assign(F, { kind: 'all', d3: 'all', sup: false, unw: false, genre: 'all', letter: 'all' }); $('#search').value = ''; saveF(); renderGrid(); }
});
$('#fsort').onchange = () => setF('sort', $('#fsort').value);
$('#search').oninput = () => renderGrid();

// ---------- detail views (click a title) ----------
function tagsOf(it) {
  const t = [];
  if (is3d(it.info.is3d)) t.push(`<span class="pill b3d">${{ hsbs: '3D Half SBS', fsbs: '3D Full SBS' }[it.info.is3d] || '3D'}</span>`);
  if (it.fmt) t.push(`<span class="pill">${esc(it.fmt)}</span>`);
  if (it.super) t.push('<span class="pill bsup">SUPER MOFLEX</span>');
  return t.join('');
}

function itemDetail(id) {
  const it = libData.items.find(x => x.id === id); if (!it) return;
  const i = it.info;
  const meta = [i.year, KIND1[it.kind], i.runtime ? fmtMin(i.runtime) : it.dur ? fmtMin(Math.round(it.dur / 60000)) : '',
    genresOf(i.genres).join(', ')].filter(Boolean);
  open(`
    <div class="detail">
      <div class="art">${it.poster ? `<img src="/api/items/${id}/poster?w=340&h=486&v=${bust}" alt="">` : ''}</div>
      <div>
        <h3>${esc(i.title || 'Untitled')}</h3>
        <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>
        <div class="tags">${tagsOf(it)}</div>
        ${i.summary ? `<p class="sum">${esc(i.summary)}</p>` : ''}
        <div class="path">${esc(it.path)}</div>
      </div>
    </div>
    <div class="actions"><button id="dclose" style="margin-right:auto">Close</button><button id="dedit" class="admin">Edit info</button>
      <button id="dseen">${it.watched ? 'Mark unwatched' : 'Mark watched'}</button>
      <span id="dwatch"></span></div>`);
  $('#dclose').onclick = close;
  $('#dedit').onclick = () => itemDialog(id);
  $('#dseen').onclick = async () => { await setWatched(id, !it.watched); itemDetail(id); };
  watchButtons(id, $('#dwatch'));
}

// watched / not, for this browser (clears its resume point either way)
async function setWatched(id, on) {
  await api('POST', `/api/items/${id}/watched?on=${on ? 1 : 0}&client=${encodeURIComponent(webClient)}`);
  await loadLib();
}

// Watch / Resume for one item: resume when this browser stopped part-way
async function watchButtons(id, box) {
  if (!state.ffmpeg || !state.ffmpeg.found) {
    box.innerHTML = '<span class="hint">Watching in the browser needs FFmpeg (see Settings).</span>'; return;
  }
  box.innerHTML = '<button class="primary" data-w="0">▶ Watch</button>';
  try {
    const e = await api('GET', `/api/items/${id}?client=${encodeURIComponent(webClient)}`);
    if (e && e.pos > 30000 && (!e.dur || e.pos < e.dur - 60000))
      box.innerHTML = `<button data-w="0">From the start</button> <button class="primary" data-w="${e.pos}">▶ Resume ${fmtTime(e.pos)}</button>`;
  } catch {}
  box.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { close(); watch(id, +b.dataset.w); });
}

function showDetail(sid) {
  const sh = libData.shows.find(x => x.id === sid); if (!sh) return;
  const eps = libData.items.filter(i => i.showId === sid && !i.missing)
    .sort((a, b) => (seasonOrder(a.info.season) - seasonOrder(b.info.season)) || ((a.info.episode || 0) - (b.info.episode || 0)));
  const seasons = [...new Set(eps.map(e => e.info.season || 0))];
  const i = sh.info;
  const meta = [i.year, `${seasons.length} season${seasons.length === 1 ? '' : 's'}`, `${eps.length} episode${eps.length === 1 ? '' : 's'}`, genresOf(i.genres).join(', ')].filter(Boolean);
  open(`
    <div class="detail">
      <div class="art">${sh.poster ? `<img src="/api/shows/${sid}/poster?w=340&h=486&v=${bust}" alt="">` : ''}</div>
      <div>
        <h3>${esc(i.title || 'Untitled')}</h3>
        <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>
        ${eps.some(e => is3d(e.info.is3d)) ? '<div class="tags"><span class="pill b3d">3D</span></div>' : ''}
        ${i.summary ? `<p class="sum">${esc(i.summary)}</p>` : ''}
      </div>
    </div>
    <div class="seasons">${seasons.map(n => `<h4>${n ? 'Season ' + n : 'Specials'}</h4>` + eps.filter(e => (e.info.season || 0) === n).map(x =>
      `<div class="ep"><span class="ck" title="${x.watched ? 'Watched' : ''}">${x.watched ? '✓' : ''}</span><span class="n">E${x.info.episode || 0}</span><span class="x">${esc(x.info.epTitle || x.info.title || '')}</span>
        ${progOf(x) ? `<span class="bar2" title="${fmtTime(x.pos)}"><div style="width:${progOf(x) * 100}%"></div></span>` : ''}
        ${x.fmt ? `<span class="hint hide-sm">${esc(x.fmt)}</span>` : ''}<button class="small" data-epd="${x.id}">Details</button>
        <button class="small primary play" data-epw="${x.id}" title="Watch">▶</button></div>`).join('')).join('')}</div>
    <div class="actions"><button id="dclose" style="margin-right:auto">Close</button><button id="dedit" class="admin">Edit show</button>
      <button id="dseen">${eps.every(e => e.watched) ? 'Mark all unwatched' : 'Mark all watched'}</button></div>`);
  $('#dseen').onclick = async () => { const on = !eps.every(e => e.watched);
    for (const e of eps) if (!!e.watched !== on) await api('POST', `/api/items/${e.id}/watched?on=${on ? 1 : 0}&client=${encodeURIComponent(webClient)}`);
    await loadLib(); showDetail(sid); };
  $('#dclose').onclick = close;
  $('#dedit').onclick = () => showDialog(sid);
  document.querySelectorAll('[data-epd]').forEach(b => b.onclick = () => itemDetail(b.dataset.epd));
  document.querySelectorAll('[data-epw]').forEach(b => b.onclick = () => { close(); watch(b.dataset.epw, -1); });
}

// ---------- dialogs ----------
const dlg = $('#dlg');
function open(html) { $('#dlgbody').innerHTML = html; if (!dlg.open) dlg.showModal(); }
function close() { dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg) close(); });

function field(id, labelText, value, placeholder, type = 'text') {
  return `<label for="${id}">${labelText}</label><input id="${id}" type="${type}" value="${esc(value || '')}" placeholder="${esc(placeholder || '')}">`;
}

// Library add (a wizard: folders, then a name) and edit (one screen), with a folder browser.
// The name is kept as it is typed, so redrawing the folder list never clears it.
function libDialog(lib) {
  const folders = lib ? [...lib.folders] : [];
  let name = lib ? lib.name : '', step = lib ? 'edit' : 'folders', at = '';
  const base = p => p.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p;
  const folderList = () => `<div id="flist">${folders.map((f, i) => `<div class="row" style="margin:4px 0"><span style="overflow-wrap:anywhere">${esc(f)}</span>
       <button class="small" style="flex:none" data-rm="${i}">Remove</button></div>`).join('') || '<div class="hint">None yet — browse to a folder and press “Add this folder”.</div>'}</div>`;
  const draw = () => {
    if (step === 'name') open(`
      <h3>Add a library — name it</h3>
      ${field('lname', 'Name (what the 3DS shows)', name, 'Movies, 3D Movies, Cartoons…')}
      <label>Folders</label>${folders.map(f => `<div class="hint" style="overflow-wrap:anywhere">${esc(f)}</div>`).join('')}
      <div class="err" id="lerr"></div>
      <div class="actions"><button id="lback" style="margin-right:auto">Back</button>
        <button id="lcancel">Cancel</button><button class="primary" id="lsave">Add and scan</button></div>`);
    else open(`
      <h3>${lib ? 'Edit library' : 'Add a library — choose its folders'}</h3>
      ${lib ? field('lname', 'Name (what the 3DS shows)', name, 'Movies, 3D Movies, Cartoons…') : ''}
      <label>Folders</label>${folderList()}
      <div id="browser"></div>
      <div class="err" id="lerr"></div>
      <div class="actions">
        ${lib ? '<button id="ldel" style="margin-right:auto">Remove library</button>' : ''}
        <button id="lcancel">Cancel</button>
        <button class="primary" id="${lib ? 'lsave' : 'lnext'}">${lib ? 'Save' : 'Next'}</button>
      </div>`);
    hook();
    if (step !== 'name') browse(at);
  };
  const hook = () => {
    const ln = $('#lname'); if (ln) ln.oninput = () => { name = ln.value; };
    const fl = $('#flist');
    if (fl) fl.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { folders.splice(+b.dataset.rm, 1); draw(); });
    $('#lcancel').onclick = close;
    if ($('#lnext')) $('#lnext').onclick = () => {
      if (!folders.length && at) folders.push(at);   // pressed Next while looking at a folder: that one
      if (!folders.length) { $('#lerr').textContent = 'Choose at least one folder first.'; return; }
      if (!name) name = base(folders[folders.length - 1]);
      step = 'name'; draw();
    };
    if ($('#lback')) $('#lback').onclick = () => { step = 'folders'; draw(); };
    if (lib && $('#ldel')) $('#ldel').onclick = async () => {
      if (!confirm(`Remove "${lib.name}" from Big Top? The video files stay where they are.`)) return;
      await api('DELETE', `/admin/api/libraries/${lib.id}`); close(); curLib = null; refresh();
    };
    if ($('#lsave')) $('#lsave').onclick = async () => {
      try {
        const body = { name, folders };
        if (lib) await api('PUT', `/admin/api/libraries/${lib.id}`, body);
        else { const r = await api('POST', '/admin/api/libraries', body); curLib = r.id; }
        close(); refresh(); poll();
      } catch (e) { $('#lerr').textContent = e.message; }
    };
  };
  const browse = async path => {
    try {
      const d = await api('GET', '/admin/api/browse?path=' + encodeURIComponent(path));
      at = d.path || '';
      const added = folders.includes(d.path);
      $('#browser').innerHTML = `<div class="card">
        <div class="row"><b style="overflow-wrap:anywhere">${esc(d.path || 'Choose a drive or folder')}</b>
          ${d.path ? `<button class="small ${added ? '' : 'primary'}" style="flex:none" id="pick" ${added ? 'disabled' : ''}>${added ? 'Added' : 'Add this folder'}${d.videos ? ` (${d.videos} videos here)` : ''}</button>` : ''}</div>
        <div class="picker">
          ${d.path ? `<div data-p="${esc(d.parent)}">⬆ Up</div>` : ''}
          ${d.dirs.map(x => `<div data-p="${esc(x.path)}">📁 ${esc(x.name)}</div>`).join('') || '<div>No folders inside.</div>'}
        </div></div>`;
      $('#browser').querySelectorAll('[data-p]').forEach(el => el.onclick = () => browse(el.dataset.p));
      if (d.path && !added) $('#pick').onclick = () => { folders.push(d.path); draw(); };
    } catch (e) { $('#lerr').textContent = e.message; }
  };
  draw();
}

// moflex holds its own stereo layout: 2D or 3D. Other formats must say how the frame splits.
const is3dSel = (v, moflex, detected) => {
  const opts = moflex ? [['2d', '2D'], ['3d', '3D']] : [['2d', '2D'], ['hsbs', '3D Half SBS'], ['fsbs', '3D Full SBS']];
  const name = { '2d': '2D', '3d': '3D', hsbs: '3D Half SBS', fsbs: '3D Full SBS' };
  return `<select id="e3d"><option value="">As detected (${name[detected] || '2D'})</option>` +
    opts.map(([k, t]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${t}</option>`).join('') + '</select>';
};
const srcText = { super: 'its super moflex info', catalog: 'the Clownsec catalog', filename: 'its file name only' };

function itemDialog(id) {
  const it = libData.items.find(x => x.id === id); if (!it) return;
  const d = it.detected, e = it.edit, ep = !!it.showId;

// ---------- the player ----------
// Big Top converts the file to HLS (H.264 + AAC) from the time asked; a seek outside what's loaded
// asks again from there. 3D comes as both eyes side by side in one frame, drawn here with WebGL as
// anaglyph (red/cyan), full or half side-by-side for 3D screens, or 2D (the left eye).
const webClient = (() => {
  try { let c = localStorage.getItem('bt.client'); if (!c) { c = 'web-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('bt.client', c); } return c; }
  catch { return 'web'; }
})();
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
try { localStorage.removeItem('bt.view'); localStorage.removeItem('bt.swap'); } catch {}
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
const fmtTime = ms => { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, x = String(t % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const P = { id: null, sess: null, hls: null, base: 0, gen: 0, dragging: false, ended: false, gl: null, raf: 0, idleT: 0, progT: 0, lastSaved: 0, audioN: -1 };
const pv = $('#pvid'), pc = $('#pcan');
const VIEWS = { anaglyph: 'Anaglyph (red / cyan glasses)', fsbs: 'Side by side — full', hsbs: 'Side by side — half', '2d': '2D' };
const SRCS = { '2d': '2D', hsbs: '3D Half SBS', fsbs: '3D Full SBS' };

let hlsLoad;
function needHls() {
  // hls.js wherever the browser has Media Source (iPhones too, since iOS 17.1); else the browser's own
  // HLS (older iPhones). Not the other way round: some browsers claim HLS and then can't play it.
  if (!window.MediaSource && !window.ManagedMediaSource) return Promise.resolve(null);
  return hlsLoad ||= new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = '/hls.min.js';
    sc.onload = () => ok(window.Hls); sc.onerror = () => no(new Error('could not load the player')); document.head.appendChild(sc); });
}

function srcLayout() { return lsGet('bt.src.' + P.id, '') || (P.sess && P.sess.frame) || '2d'; }
// Every choice in the 3D menu belongs to one video: each video starts from what was detected (3D:
// anaglyph), and a change is remembered for that video only.
function viewMode() { return srcLayout() === '2d' ? '2d' : lsGet('bt.view.' + P.id, 'anaglyph'); }
const swapped = () => lsGet('bt.swap.' + P.id, '0') === '1';
const now = () => P.sess ? (pv.readyState ? pv.currentTime : P.startAt) * 1000 : 0;

async function watch(id, at) {
  const it = libData.items.find(x => x.id === id);
  P.id = id; P.ended = false; P.audioN = -1; P.cues = []; $('#pcc').classList.remove('on');
  $('#player').hidden = false; document.body.style.overflow = 'hidden';
  $('#ptitle').textContent = it ? (it.showId ? `${it.info.show} · S${it.info.season || 0}E${it.info.episode || 0} ${it.info.epTitle || ''}` : it.info.title) : '';
  pv.volume = +lsGet('bt.vol', 1); $('#pvol').value = pv.volume;
  if (at < 0) { // resume if this browser stopped part-way
    at = 0;
    try { const e = await api('GET', `/api/items/${id}?client=${encodeURIComponent(webClient)}`); if (e && e.pos > 30000) at = e.pos; } catch {}
  }
  showUI(); start(at);
}

async function start(at) {
  const gen = ++P.gen;
  msg(''); spin(true);
  stopStream(true);
  let s;
  try {
    const q = new URLSearchParams({ at: Math.round(at), client: webClient });
    const aud = lsGet('bt.aud.' + P.id, ''), ver = lsGet('bt.ver.' + P.id, '');
    if (aud) q.set('audio', aud);
    if (ver) q.set('version', ver);
    const own = lsGet('bt.src.' + P.id, '');
    if (own) q.set('src', own);
    if (bakeMode()) { q.set('view', viewMode()); if (swapped()) q.set('swap', '1'); }
    s = await api('GET', `/api/items/${P.id}/web?${q}`);
  } catch (x) { if (gen === P.gen) { spin(false); msg(esc(x.message)); } return; }
  if (gen !== P.gen) { fetch(s.url.replace('index.m3u8', 'stop'), { method: 'POST' }); return; }
  P.sess = s; P.base = 0; P.startAt = at / 1000;
  $('#paud').hidden = !((s.audio && s.audio.length > 1) || (s.versions && s.versions.length > 1));
  $('#pcc').hidden = !(s.subs && s.subs.length);
  loadSubs();
  let Hls;
  try { Hls = await needHls(); } catch (x) { spin(false); msg(esc(x.message)); return; }
  if (gen !== P.gen) return;
  if (Hls && Hls.isSupported()) {
    const h = new Hls({ startPosition: at / 1000, maxBufferLength: 30, backBufferLength: 60,
      // a part not converted yet takes Big Top a moment to start on
      fragLoadPolicy: { default: { maxTimeToFirstByteMs: 45000, maxLoadTimeMs: 90000,
        timeoutRetry: { maxNumRetry: 2, retryDelayMs: 0, maxRetryDelayMs: 0 },
        errorRetry: { maxNumRetry: 3, retryDelayMs: 1000, maxRetryDelayMs: 8000 } } } });
    P.hls = h; P.native = false;
    if (!window.MediaSource) pv.disableRemotePlayback = true; // iPhone's Managed Media Source requires it
    h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) console.warn('player:', d.type, d.details, d.response ? d.response.code : ''); if (d.fatal && gen === P.gen) recover(); });
    h.loadSource(s.url); h.attachMedia(pv);
  } else if (pv.canPlayType('application/vnd.apple.mpegurl')) {
    P.native = true; pv.src = s.url;
    pv.addEventListener('loadedmetadata', () => { if (at > 0) pv.currentTime = at / 1000; }, { once: true });
  } else { spin(false); msg('This browser can\'t play the stream.'); return; }
  pv.play().catch(() => {});
  setupRender();
}

// the stream broke (Big Top restarted, a long pause outlived it): start again where we were
let recovering = 0;
function recover() {
  if (Date.now() - recovering < 4000) { spin(false); msg('The stream stopped. <button class="pbtn" onclick="start(now())">Try again</button>'); return; }
  recovering = Date.now(); start(now());
}

function stopStream(keepUI) {
  if (P.hls) { P.hls.destroy(); P.hls = null; }
  if (P.sess) { const u = P.sess.url.replace('index.m3u8', 'stop'); navigator.sendBeacon ? navigator.sendBeacon(u) : fetch(u, { method: 'POST' }); }
  pv.removeAttribute('src'); pv.load();
  P.sess = null;
}

function closePlayer() {
  saveProgress(true);
  P.gen++; stopStream();
  cancelAnimationFrame(P.raf);
  $('#player').hidden = true; $('#pmenu').hidden = true; document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  P.id = null;
  setTimeout(loadLib, 400); // the tiles' progress and ticks
}

// the stream is the whole film: a seek just moves (Big Top makes the part if it isn't there yet)
function seekTo(ms) {
  if (!P.sess) return;
  const d = P.sess.dur || Infinity;
  pv.currentTime = Math.max(0, Math.min(ms, d - 1000)) / 1000;
}

function saveProgress(stopped) {
  if (!P.id || !P.sess) return;
  const pos = Math.round(now()), dur = P.sess.dur || 0;
  if (!stopped && Math.abs(pos - P.lastSaved) < 5000) return;
  P.lastSaved = pos;
  const q = new URLSearchParams({ pos: P.ended ? dur : pos, dur, state: stopped ? 'stopped' : 'playing', client: webClient });
  const u = `/api/items/${P.id}/progress?${q}`;
  stopped && navigator.sendBeacon ? navigator.sendBeacon(u) : fetch(u, { method: 'POST' }).catch(() => {});
}

const spin = on => { $('#pspin').hidden = !on; };
const msg = h => { $('#pmsg').innerHTML = h; $('#pmsg').hidden = !h; };

// ----- drawing: the <video> itself for 2D, WebGL for the 3D views
const FS = `precision mediump float;
varying vec2 uv; uniform sampler2D tex; uniform int mode; uniform int sbs; uniform int swap;
vec3 eye(int right, vec2 p) {
  if (sbs == 0) return texture2D(tex, p).rgb;
  int r = swap == 1 ? 1 - right : right;
  return texture2D(tex, vec2((p.x + float(r)) * 0.5, p.y)).rgb;
}
void main() {
  vec3 c;
  if (mode == 1) {        // anaglyph, red/cyan (Dubois: truer colour, less ghosting than plain channel mixing)
    vec3 l = eye(0, uv), r = eye(1, uv);
    c = clamp(mat3(0.437, -0.062, -0.048, 0.449, -0.062, -0.050, 0.164, -0.024, -0.017) * l +
              mat3(-0.011, 0.377, -0.026, -0.032, 0.761, -0.093, -0.007, 0.009, 1.234) * r, 0.0, 1.0);
  } else if (mode == 2) { // side by side: left eye in the left half
    c = uv.x < 0.5 ? eye(0, vec2(uv.x * 2.0, uv.y)) : eye(1, vec2(uv.x * 2.0 - 1.0, uv.y));
  } else {                // 2D: the left eye
    c = eye(0, uv);
  }
  gl_FragColor = vec4(c, 1.0);
}`;
function glInit() {
  const gl = pc.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return null;
  const sh = (t, src) => { const x = gl.createShader(t); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p; varying vec2 uv; void main(){ uv = vec2(p.x*0.5+0.5, 0.5-p.y*0.5); gl_Position = vec4(p,0.0,1.0); }'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  return { gl, u: n => gl.getUniformLocation(pr, n) };
}

// iPhones can't put a page element full screen, only a <video>: there, Big Top draws the 3D view into
// the picture itself (FFmpeg), so the plain video -- with its own full-screen controls -- shows it.
const elemFS = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const bakeMode = () => !elemFS && srcLayout() !== '2d';

function setupRender() {
  const src = srcLayout(), view = viewMode();
  const canvas = (view !== '2d' || src !== '2d') && !(P.sess && P.sess.baked);
  pc.hidden = !canvas; pv.classList.toggle('under', canvas);
  $('#p3d').classList.toggle('on', view !== '2d');
  cancelAnimationFrame(P.raf);
  if (!canvas) return;
  if (!P.gl && !(P.gl = glInit())) { pc.hidden = true; pv.classList.remove('under'); msg('3D needs WebGL, which this browser doesn\'t have.'); return; }
  const { gl, u } = P.gl;
  const draw = () => {
    P.raf = requestAnimationFrame(draw);
    const W = pv.videoWidth, H = pv.videoHeight;
    if (!W || pv.readyState < 2) return;
    // the shape of what's shown: one eye, or two side by side
    const eyeAR = src === '2d' ? W / H : src === 'hsbs' ? W / H : W / 2 / H;
    const ar = view === 'fsbs' ? eyeAR * 2 : eyeAR;
    const st = $('#pstage'), sw = st.clientWidth, sh = st.clientHeight;
    let cw = sw, ch = sw / ar; if (ch > sh) { ch = sh; cw = sh * ar; }
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const pw = Math.round(cw * dpr), ph = Math.round(ch * dpr);
    if (pc.width !== pw || pc.height !== ph) { pc.width = pw; pc.height = ph; }
    pc.style.width = cw + 'px'; pc.style.height = ch + 'px';
    gl.viewport(0, 0, pw, ph);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, pv);
    gl.uniform1i(u('mode'), view === 'anaglyph' ? 1 : view === '2d' ? 0 : 2);
    gl.uniform1i(u('sbs'), src === '2d' ? 0 : 1);
    gl.uniform1i(u('swap'), swapped() ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
  draw();
}

// ----- controls
function showUI() {
  $('#player').classList.remove('idle');
  clearTimeout(P.idleT);
  P.idleT = setTimeout(() => { if (!pv.paused && $('#pmenu').hidden && !P.dragging) $('#player').classList.add('idle'); }, 3000);
}
function tick() {
  if (!P.sess) return;
  const d = P.sess.dur, t = now();
  if (!P.dragging) { $('#pseek').max = d || 1; $('#pseek').value = t; }
  $('#ptime').textContent = d ? `${fmtTime(P.dragging ? +$('#pseek').value : t)} / ${fmtTime(d)}` : fmtTime(t);
}
pv.addEventListener('playing', () => { spin(false); msg(''); $('#pplay').textContent = '❚❚'; showUI(); });
pv.addEventListener('pause', () => { $('#pplay').textContent = '▶'; showUI(); saveProgress(false); });
pv.addEventListener('waiting', () => spin(true));
pv.addEventListener('timeupdate', () => { tick(); saveProgress(false); });
// Safari's own HLS reports a broken stream here (hls.js reports through its own events); clearing
// the old source also fires this, with no source set
pv.addEventListener('error', () => { if (P.sess && P.native && pv.getAttribute('src')) recover(); });
pv.addEventListener('ended', () => { P.ended = true; saveProgress(true); nextEpisode(); });

function nextEpisode() {
  const it = libData.items.find(x => x.id === P.id);
  if (!it || !it.showId) return;
  const eps = libData.items.filter(i => i.showId === it.showId && !i.missing)
    .sort((a, b) => (seasonOrder(a.info.season) - seasonOrder(b.info.season)) || ((a.info.episode || 0) - (b.info.episode || 0)));
  const nx = eps[eps.findIndex(e => e.id === it.id) + 1];
  if (!nx) return;
  let n = 8;
  const show = () => msg(`Next: S${nx.info.season || 0}E${nx.info.episode || 0} ${esc(nx.info.epTitle || '')} in ${n} s<br><br>
    <button class="pbtn" id="pnext">Play now</button> <button class="pbtn" id="pstay">Cancel</button>`);
  show();
  const t = setInterval(() => { if (--n <= 0) go(); else show(), bind(); }, 1000);
  const go = () => { clearInterval(t); watch(nx.id, 0); };
  const bind = () => { $('#pnext').onclick = go; $('#pstay').onclick = () => { clearInterval(t); msg(''); }; };
  bind();
}

$('#pplay').onclick = () => pv.paused ? pv.play() : pv.pause();
$('#pback').onclick = () => seekTo(now() - 10000);
$('#pfwd').onclick = () => seekTo(now() + 10000);
$('#pclose').onclick = closePlayer;
$('#pseek').addEventListener('input', () => { P.dragging = true; tick(); showUI(); });
$('#pseek').addEventListener('change', () => { P.dragging = false; seekTo(+$('#pseek').value); });
$('#pvol').oninput = () => { pv.volume = +$('#pvol').value; pv.muted = false; lsSet('bt.vol', pv.volume); };
$('#pfs').onclick = () => {
  const el = $('#player');
  if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) { Promise.resolve(req.call(el)).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {}); return; }
  // iPhone: only a video can go full screen (3D is drawn into it by Big Top there)
  try { if (pv.webkitEnterFullscreen) return pv.webkitEnterFullscreen(); } catch {}
  msg('This browser can\'t go full screen here. Turn the phone sideways, or use Share → <b>Add to Home Screen</b> and open Big Top from there.<br><br><button class="pbtn" onclick="msg(\'\')">OK</button>');
};
$('#pstage').addEventListener('click', () => { if (!$('#pmenu').hidden) { $('#pmenu').hidden = true; return; } if (matchMedia('(hover: hover)').matches) pv.paused ? pv.play() : pv.pause(); showUI(); });
$('#player').addEventListener('mousemove', showUI);
$('#player').addEventListener('touchstart', showUI, { passive: true });
document.addEventListener('keydown', ev => {
  if ($('#player').hidden || ev.target.matches('input[type=text], input[type=search], textarea')) return;
  const k = ev.key;
  if (k === ' ' || k === 'k') { ev.preventDefault(); pv.paused ? pv.play() : pv.pause(); }
  else if (k === 'ArrowLeft') seekTo(now() - 10000);
  else if (k === 'ArrowRight') seekTo(now() + 10000);
  else if (k === 'f') $('#pfs').click();
  else if (k === 'Escape' && !document.fullscreenElement) closePlayer();
  else return;
  showUI();
});

function menu3d() {
  const src = srcLayout(), view = viewMode(), det = (P.sess && P.sess.frame) || '2d', own = lsGet('bt.src.' + P.id, '');
  const m = $('#pmenu');
  m.innerHTML = `<h5>View</h5>${Object.entries(VIEWS).map(([k, l]) => `<button data-v="${k}" class="${view === k ? 'on' : ''}" ${src === '2d' && k !== '2d' ? 'disabled' : ''}>${l}</button>`).join('')}
    <label style="display:flex;gap:8px;align-items:center;color:#fff;font-size:14px;padding:6px 8px"><input type="checkbox" id="pswap" style="width:auto" ${swapped() ? 'checked' : ''} ${src === '2d' ? 'disabled' : ''}> Swap eyes</label>
    <h5>This video is</h5>
    <button data-s="" class="${!own ? 'on' : ''}">As detected (${SRCS[det]})</button>
    ${Object.entries(SRCS).map(([k, l]) => `<button data-s="${k}" class="${own === k ? 'on' : ''}">${l}</button>`).join('')}
    ${src === '2d' ? '<div class="hint">A 2D video plays in 2D. If it’s really two pictures side by side, pick its layout above.</div>' : ''}`;
  m.hidden = false;
  // where Big Top draws the 3D (iPhones), a change is a new stream from here; else just a redraw
  const apply = () => { if (!elemFS || (P.sess && P.sess.baked)) start(now()); else setupRender(); menu3d(); };
  m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { lsSet('bt.view.' + P.id, b.dataset.v === 'anaglyph' ? null : b.dataset.v); apply(); });
  m.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    lsSet('bt.src.' + P.id, b.dataset.s || null);
    // an MP4's layout decides how Big Top shapes the picture: a new stream from here
    const it = libData.items.find(x => x.id === P.id);
    if (it && !it.moflex) start(now()); else apply();
  });
  $('#pswap').onchange = ev => { lsSet('bt.swap.' + P.id, ev.target.checked ? '1' : null); if (P.sess && P.sess.baked) start(now()); };
}
// audio track and video version: each choice is this video's, and a new stream from here
// (a moflex's track 0 is its default, so it isn't stored)
function menuAudio() {
  const m = $('#pmenu'), s = P.sess || {}, a = s.audio || [], v = s.versions || [];
  const cur = s.audioN, vcur = s.versionN || 0;
  m.innerHTML = (a.length > 1 ? '<h5>Audio</h5>' + a.map(t => `<button data-a="${t.n}" class="${cur === t.n || (cur < 0 && t.default) ? 'on' : ''}">${esc(t.name)}</button>`).join('') : '') +
    (v.length > 1 ? '<h5>Version</h5>' + v.map(t => `<button data-ver="${t.n}" class="${vcur === t.n ? 'on' : ''}">${esc(t.name)}</button>`).join('') : '');
  m.hidden = false;
  m.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { lsSet('bt.aud.' + P.id, +b.dataset.a > 0 || !itemOf().moflex ? b.dataset.a : null); m.hidden = true; start(now()); });
  m.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => { lsSet('bt.ver.' + P.id, +b.dataset.ver ? b.dataset.ver : null); m.hidden = true; start(now()); });
}
const itemOf = () => libData.items.find(x => x.id === P.id) || {};

// ----- subtitles: drawn over the picture, once per eye in side-by-side views. Where Big Top draws
// the 3D (an iPhone's own full-screen player shows only text tracks), a WebVTT track instead --
// with every line twice, one per half, for side by side.
P.cues = []; P.subText = null;
async function loadSubs() {
  const n = lsGet('bt.sub.' + P.id, ''), id = P.id;
  P.cues = []; drawSubs(true);
  [...pv.querySelectorAll('track')].forEach(t => t.remove());
  if (n === '' || !P.sess || !P.sess.subs.some(t => t.n === +n)) return;
  $('#pcc').classList.add('on');
  if (P.sess.baked) {
    const tr = document.createElement('track');
    tr.kind = 'subtitles'; tr.default = true; tr.label = P.sess.subs[+n].name;
    tr.src = `/api/items/${id}/websubs/${n}.vtt?eyes=${['fsbs', 'hsbs'].includes(P.sess.baked) ? 2 : 1}&depth=${subDepth()}`;
    pv.appendChild(tr);
    tr.addEventListener('load', () => { tr.track.mode = 'showing'; });
    tr.track.mode = 'showing';
    return;
  }
  try { const c = await api('GET', `/api/items/${id}/websubs/${n}`); if (P.id === id) P.cues = c; } catch {}
}
function subAt(ms) {
  // cues are sorted by start; the lines showing now (several can overlap)
  let lo = 0, hi = P.cues.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (P.cues[mid][0] <= ms) lo = mid + 1; else hi = mid; }
  const out = [];
  for (let i = lo - 1; i >= 0 && i >= lo - 12; i--) if (P.cues[i][1] > ms) out.unshift(P.cues[i][2]);
  return out.join('\n');
}
let subGeo = '';
function drawSubs(force) {
  const box = $('#psubs');
  const text = P.cues.length ? subAt(now()) : '';
  if (!text) { if (box.childElementCount) box.innerHTML = ''; subGeo = ''; return; }
  // the picture's rectangle in the stage
  const st = $('#pstage').getBoundingClientRect();
  let r;
  if (!pc.hidden) r = pc.getBoundingClientRect();
  else {
    const W = pv.videoWidth || 16, H = pv.videoHeight || 9, sw = st.width, sh = st.height;
    let w = sw, h = sw * H / W; if (h > sh) { h = sh; w = sh * W / H; }
    r = { left: st.left + (sw - w) / 2, top: st.top + (sh - h) / 2, width: w, height: h };
  }
  const view = pc.hidden ? '2d' : viewMode();
  const two = view === 'fsbs' || view === 'hsbs';
  const fs = Math.max(12, Math.min(46, r.height * (two && view === 'fsbs' ? 0.06 : 0.055)));
  // one fixed place, always clear of the controls (they come and go; the subtitles don't move)
  const lift = Math.max(r.height * 0.06, $('.pbot').offsetHeight - (st.top + st.height - (r.top + r.height)));
  const geo = [text, view, r.left, r.top, r.width, r.height, lift, subDepth()].join('|');
  if (geo === subGeo && !force) return;
  subGeo = geo;
  const x0 = r.left - st.left, y0 = r.top - st.top, eyeW = two ? r.width / 2 : r.width;
  // depth: the eyes' copies shifted apart, left eye's to the right (in front of the screen)
  const d = view === '2d' ? 0 : subDepth() * 0.0015 * eyeW; // 10 = 1.5% of an eye: plenty
  const ln = (cls, style) => `<div class="ln ${cls} ${view === 'hsbs' ? 'sq' : ''}" style="font-size:${fs}px;${view === 'hsbs' ? 'width:200%;flex:none;' : ''}${style}">${esc(text)}</div>`;
  const eye = (left, inner) => `<div class="eye" style="left:${left}px;top:${y0}px;width:${eyeW}px;height:${r.height}px;padding-bottom:${lift}px">${inner}</div>`;
  if (two) {
    const dx = view === 'hsbs' ? d / 2 : d; // half SBS: the picture is squeezed, so is the shift
    box.innerHTML = eye(x0, ln('', `transform:translateX(${dx}px)${view === 'hsbs' ? ' scaleX(.5)' : ''}`)) +
      eye(x0 + eyeW, ln('', `transform:translateX(${-dx}px)${view === 'hsbs' ? ' scaleX(.5)' : ''}`));
  } else if (view === 'anaglyph' && d) {
    // the left eye sees red, the right cyan: a red copy and a cyan copy, apart by the depth
    // (white where they overlap), on their black outlines
    box.innerHTML = eye(x0, ln('', `position:absolute;left:0;right:0;bottom:${lift}px;color:#000;transform:translateX(${d / 2}px)`) +
      ln('', `position:absolute;left:0;right:0;bottom:${lift}px;color:#000;transform:translateX(${-d / 2}px)`) +
      ln('red', `position:absolute;left:0;right:0;bottom:${lift}px;text-shadow:none;color:#f00;mix-blend-mode:screen;transform:translateX(${d / 2}px)`) +
      ln('cyan', `position:absolute;left:0;right:0;bottom:${lift}px;text-shadow:none;color:#0ff;mix-blend-mode:screen;transform:translateX(${-d / 2}px)`));
  } else {
    box.innerHTML = eye(x0, ln('', ''));
  }
}
// subtitle depth: -10 (behind the screen) .. 10 (well in front); one setting for every video
const subDepth = () => Math.max(-10, Math.min(10, +lsGet('bt.subdepth', 3) || 0));
(function subLoop() { requestAnimationFrame(subLoop); if (!$('#player').hidden) drawSubs(false); })();
function menuCC() {
  const m = $('#pmenu'), cur = lsGet('bt.sub.' + P.id, ''), subs = (P.sess && P.sess.subs) || [];
  m.innerHTML = (srcLayout() !== '2d' ? `<h5>Subtitle depth</h5><div style="display:flex;gap:8px;align-items:center;padding:4px 8px;font-size:13px">
      <span>Back</span><input type="range" id="pdepth" min="-10" max="10" step="1" value="${subDepth()}" style="flex:1;accent-color:var(--accent);padding:0;border:0;background:none">
      <span>Front</span></div>` : '') +
    '<h5>Subtitles</h5>' + `<button data-cc="" class="${cur === '' ? 'on' : ''}">Off</button>` +
    subs.map(t => `<button data-cc="${t.n}" class="${cur === String(t.n) ? 'on' : ''}">${esc(t.name)}</button>`).join('');
  m.hidden = false;
  const dp = $('#pdepth');
  if (dp) {
    dp.oninput = () => { lsSet('bt.subdepth', dp.value); drawSubs(true); };
    dp.onchange = () => { if (P.sess && P.sess.baked) loadSubs(); }; // the phone's track carries the depth
  }
  m.querySelectorAll('[data-cc]').forEach(b => b.onclick = () => {
    lsSet('bt.sub.' + P.id, b.dataset.cc || null); $('#pcc').classList.toggle('on', !!b.dataset.cc); m.hidden = true; loadSubs();
  });
}
const toggleMenu = (k, fill) => ev => {
  ev.stopPropagation();
  const m = $('#pmenu');
  if (!m.hidden && m.dataset.k === k) { m.hidden = true; return; }
  fill(); m.dataset.k = k;
};
$('#p3d').onclick = toggleMenu('3d', menu3d);
$('#paud').onclick = toggleMenu('a', menuAudio);
$('#pcc').onclick = toggleMenu('cc', menuCC);
window.addEventListener('pagehide', () => { if (P.id) { saveProgress(true); stopStream(); } });

let polling = false;
async function poll() {
  if (polling) return; polling = true;
  try {
    let tick = 0;
    while (await loadState()) { if (++tick % 3 === 0) loadLib(); await new Promise(r => setTimeout(r, 1500)); }
    bust = Date.now(); await loadLib();
  } finally { polling = false; }
}
async function refresh() { await loadState(); await loadLib(); }
refresh().then(() => { if (state.scan.running) poll(); });
</script>
</body>
</html>
